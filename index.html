<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electron Video Player</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000; /* Set background color to black */
        cursor: none;
      }
      * {
        cursor: none !important;
      }
      #videoContainer {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #videoPlayer {
        width: 100%;
        height: 100%;
        transition: opacity 1s;
      }
      #backgroundImage {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .video-blur {
        opacity: 0.5; /* Đặt opacity để làm mờ video */
      }
    </style>
  </head>
  <body>
    <div id="videoContainer">
      <video id="videoPlayer" controls autoplay muted>
        <!-- Placeholder source -->
        <source id="videoSource" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <img
        id="backgroundImage"
        src="./resources/background.png"
        alt="Background Image"
      />
    </div>

    <script>
      const videoPlayer = document.getElementById("videoPlayer");
      const backgroundImage = document.getElementById("backgroundImage");
      const videoContainer = document.getElementById("videoContainer");
      let currentVideoIndex = 0; // Track the index of the current video
      let loopCount = 0; // Track the number of times the video has looped
      let _videos = null;
      let _videosMqtt = null;
      let numberLoopVideo = 2;
      let firstTime = true;
      let isVideosDefault = true;

      videoPlayer.controls = false; // Hide default controls

      function callValueJsonFile(data, _firstTime = null) {
        _videos = data;
        playNextVideo(data, _firstTime);
      }
      function callValueMqtt(data) {
        _videosMqtt = data;
        isVideosDefault = false;
        playNextVideo(data, true);
      }

      function playNextVideo(videos, _firstTime = null) {
        let nextVideoIndex = 0;
        firstTime = _firstTime !== null ? !!_firstTime : firstTime;
        if (firstTime) {
          nextVideoIndex = 0;
        } else {
          nextVideoIndex = (currentVideoIndex + 1) % videos.length;
        }
        const video = videos[nextVideoIndex];
        if (video && video.url) {
          updateVideoUrl(video.url);
          numberLoopVideo = video?.repeat || numberLoopVideo;
          loopCount = 0;
        } else {
          currentVideoIndex = nextVideoIndex;
          playNextVideo(videos);
        }
      }

      // Loop the video or play next video
      videoPlayer.addEventListener(
        "ended",
        function () {
          loopCount++;
          if (loopCount < numberLoopVideo) {
            // this.currentTime = 0;
            //this.classList.add("video-blur"); // Thêm lớp để làm mờ video
            this.load();
            // Wait for the video to reset
            // setTimeout(() => {
            //   this.classList.remove("video-blur");
            // }, 1000);
          } else {
            if (firstTime) {
              currentVideoIndex = 0;
              firstTime = false;
            } else {
              if (isVideosDefault) {
                currentVideoIndex = (currentVideoIndex + 1) % _videos.length;
              } else {
                const _currentVideoIndex = currentVideoIndex + 1;
                if (_currentVideoIndex === _videosMqtt.length) {
                  currentVideoIndex = 0;
                  firstTime = true;
                  videos = _videos;
                } else {
                  currentVideoIndex =
                    (currentVideoIndex + 1) % _videosMqtt.length;
                }
              }
            }
            // this.currentTime = 0;
            //this.classList.add("video-blur");
            if (isVideosDefault) {
              playNextVideo(_videos);
            } else {
              playNextVideo(_videosMqtt);
            }

            // setTimeout(() => {
            //   this.classList.remove("video-blur");
            // }, 1000);
          }
        },
        false
      );
      videoPlayer.addEventListener("error", function () {
        currentVideoIndex = (currentVideoIndex + 1) % _videos.length; // Move to the next video in the list
        playNextVideo(_videos);
      });

      function updateVideoUrl(url, mqttCall = false) {
        if (url && url !== "kill") {
          if (mqttCall) {
            loopCount = 0;
          }
          videoPlayer.style.display = "block";
          backgroundImage.style.display = "none";
          videoPlayer.src = url; // Update the video URL
          videoPlayer.load(); // Reload the video player to start playing the new video
          videoPlayer.muted = true;
        } else {
          videoPlayer.style.display = "none";
          videoPlayer.muted = true;
          backgroundImage.style.display = "block";
        }
      }
    </script>
  </body>
</html>
